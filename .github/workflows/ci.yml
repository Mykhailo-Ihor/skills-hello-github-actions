name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Produce build output
        env:
          COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p dist
          cp test.txt dist/test.txt
          {
            echo "commit=$COMMIT"
            echo "run_id=$RUN_ID"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > dist/build-info.txt
          cat dist/build-info.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/
          retention-days: 7

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: dist

      - name: Show what we got
        run: ls -R dist

      - name: Verify build output
        run: |
          test -f dist/test.txt || { echo "::error::dist/test.txt is missing"; exit 1; }
          test -s dist/test.txt || { echo "::error::dist/test.txt is empty"; exit 1; }
          grep -q '^commit=' dist/build-info.txt || { echo "::error::build-info.txt has no commit line"; exit 1; }
          echo "All checks passed"

      - name: Write job summary
        run: |
          {
            echo "### CI results"
            echo ""
            echo "Artifact \`build-output\` downloaded from the build job and verified."
            echo ""
            echo '```'
            cat dist/build-info.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
